# Secret scan on every PR.
#
# CONTRIBUTING's first non-negotiable rule is that no secret ever gets printed,
# logged, or committed. This is the machine half of enforcing it. The human half
# is still the review.
#
# Three layers cover this repo, and they are not redundant:
#
#   1. GitHub push protection (a repo setting) blocks a recognised provider token
#      at push time — the earliest and best moment, but only for patterns GitHub
#      ships and only on pushes to this repo.
#   2. GitHub secret scanning (a repo setting) sweeps history continuously.
#   3. This workflow, which runs on the PR diff — including PRs from forks, where
#      the contributor's push happened on their own repo and never met our push
#      protection at all.
#
# TruffleHog rather than gitleaks: gitleaks-action requires a paid licence key
# for organization-owned repos, and a scanner that silently no-ops when the key
# expires is worse than none. TruffleHog OSS has no such gate, and its
# `--results=verified` mode reports credentials it has actually confirmed live
# against the provider, which is the difference between a signal and a wall of
# false positives on example config.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # TruffleHog diffs a commit range, so it needs the history that range
          # spans. A shallow clone makes it silently scan nothing.
          fetch-depth: 0

      - name: Scan the diff
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          # On a PR: everything the branch adds on top of the base. On a push to
          # main: the pushed range. `main` as the fallback base keeps the first
          # run on a fresh branch from scanning nothing.
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only report credentials TruffleHog verified against the live provider.
          # Unverified matches are mostly examples and placeholder strings, and a
          # scanner that cries wolf gets muted within a month.
          extra_args: --results=verified --fail
