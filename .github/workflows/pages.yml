name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'packages/cris-asiste/skills/**'
      - 'packages/cris-asiste/scripts/build-kits.sh'
      - '.github/workflows/pages.yml'
      - 'packages/*/mcpb/manifest.json'
      - 'packages/*/server/mcp.cjs'
      - 'scripts/build-mcpb.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The cris-asiste skills, one uploadable zip each, for people who use
      # Claude in the chat where plugins don't run. Built from the same folders
      # the plugin installs from, on every deploy, so the download links on the
      # site always match main and no binary is ever committed.
      - name: Build the cris-asiste kits
        run: bash packages/cris-asiste/scripts/build-kits.sh site/kits
      # The one-click Claude Desktop extensions (.mcpb), at a stable URL that a
      # setup guide can link to: site/extensions/<name>.mcpb. Built from the
      # committed bundle on main, the same file a plugin install runs, so this
      # link always matches what the catalog ships. Versioned copies live on
      # each connector's GitHub Release (release.yml).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the Desktop extensions
        run: |
          for manifest in packages/*/mcpb/manifest.json; do
            [ -f "$manifest" ] || continue
            node scripts/build-mcpb.mjs "$(dirname "$(dirname "$manifest")")" --out site/extensions --stable
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
