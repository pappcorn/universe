# When a PR is labeled `ready-to-merge`, ping the humans who can approve it.
#
# In this repo the label is a signal, not an automation trigger: main is
# protected and only a human code-owner review (see .github/CODEOWNERS) can
# unblock a merge. This workflow just turns the label into an explicit ask.
# Re-adding the label re-triggers the ping — that is the intended way to nudge.

name: Ready to merge

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  ping-reviewers:
    if: github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the code owners for approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Tag the PR's requested reviewers; fall back to the code owners.
          mentions=$(jq -r '[.pull_request.requested_reviewers[]?.login] | map("@" + .) | join(" ")' "$GITHUB_EVENT_PATH")
          if [ -z "$mentions" ]; then
            mentions="@ni500 @lcaloguerea"
          fi
          gh pr comment "$PR_URL" --body "This PR is ready to merge — $mentions please review and approve."
