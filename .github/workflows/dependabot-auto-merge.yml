# Auto-merge Dependabot's routine bumps.
#
# `main` requires a code-owner approval, and dependabot[bot] is not a code owner
# — so without this, every patch bump sits waiting for a human to rubber-stamp
# it. That is the failure mode this repo already lived: six moderate advisories
# open on `main` with nobody watching. A dependency bot whose PRs never merge is
# worse than no bot, because it manufactures a backlog that trains you to ignore
# it.
#
# So Cris approves and arms auto-merge, but only inside a narrow box:
#
#   • the author must be dependabot[bot] (checked twice, see below);
#   • the bump must be patch or minor — never a major;
#   • the diff must not touch `.github/`. A github-actions bump edits the
#     workflow files, and `.github/` is anchored to humans in CODEOWNERS on
#     purpose: it is the directory that decides who approves. An agent that can
#     merge changes to its own approver has no guard rail. Those bumps are still
#     opened, they just wait for Nic or Leo.
#
# Auto-merge itself never bypasses anything: GitHub performs the merge only once
# every branch protection is satisfied — CI green, claude-review green, approval
# present. It waits; it cannot override.
#
# ── Why pull_request_target, and why that is safe here ──
# A `pull_request` run triggered by Dependabot gets a read-only token and NO
# access to repo secrets, so CRIS_APPROVE_PAT would be empty and the approval
# could never happen. `pull_request_target` runs in the context of the BASE
# branch, where the secret is available. The standing danger of that trigger is
# running untrusted PR code with secrets in scope — so this workflow does not
# check out the PR at all. There is no `actions/checkout`, no `npm install`, no
# build step: it reads metadata and calls the API. Do not add a checkout of
# `github.event.pull_request.head.sha` here.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write # arming native auto-merge
  pull-requests: write

jobs:
  auto-merge:
    # First guard: the event actor. Combined with the metadata step below (which
    # only succeeds on a genuine Dependabot branch) this is belt and braces.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_PAT: ${{ secrets.CRIS_APPROVE_PAT != '' }}
    steps:
      - name: Read the bump metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # Second guard: the author on the PR record itself, not just the actor.
      - name: Assert the PR really is Dependabot's
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const author = context.payload.pull_request.user.login;
            if (author !== 'dependabot[bot]') {
              core.setFailed(`Refusing: PR author is ${author}, not dependabot[bot].`);
            }

      # Third guard: the governance lock. A github-actions bump edits
      # .github/workflows/*, which CODEOWNERS anchors to humans on purpose.
      - name: Refuse if the diff touches .github/
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const governance = files.map(f => f.filename).filter(f => f.startsWith('.github/'));
            core.setOutput('in_scope', governance.length ? 'false' : 'true');
            if (governance.length) {
              core.info(`Touches ${governance.join(', ')} — leaving this one for a human.`);
            }

      - name: Approve and arm auto-merge
        if: >-
          env.HAS_PAT == 'true' &&
          steps.scope.outputs.in_scope == 'true' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.CRIS_APPROVE_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr review "$PR_URL" --approve --body \
            "✅ Routine dependency bump (\`$UPDATE_TYPE\`), nothing under \`.github/\`. Approved and queued for auto-merge — GitHub merges it once every branch protection on \`main\` is satisfied."

          # Arming is best-effort, for the same reason #27 made it best-effort in
          # cris-approve.yml: by this point the decision this workflow exists to
          # make has already been made and the approval is on the PR. Arming is
          # the convenience on top, and it fails for reasons that live in
          # settings and are invisible from the PR — `allow_auto_merge` off at the
          # repo level, or a PAT without `Contents: RW`. A red X on a healthy bump
          # for a plumbing problem is how a reader learns to stop reading the
          # checks. Warn, say it on the PR, exit 0. Nothing is bypassed: the merge
          # that still has to happen by hand faces every protection.
          if err=$(gh pr merge "$PR_URL" --auto --squash 2>&1); then
            echo "$err"
            exit 0
          fi

          echo "$err"
          echo "::warning::Could not arm auto-merge: $err"
          gh pr comment "$PR_URL" --body "⚠️ **Approved, but auto-merge could not be armed.**

          This bump qualified and I approved it. Arming GitHub's native auto-merge failed on the automation's own plumbing — a repository setting or a token permission — not on anything in this diff:

          \`\`\`
          $err
          \`\`\`

          Merge it by hand when you are ready; every branch protection still applies.

          ---
          🤖 _Cris · PappCorn's AI agent_" >/dev/null || echo "::warning::Could not post the comment either."

      - name: Say why it was left alone
        if: >-
          steps.scope.outputs.in_scope == 'false' ||
          steps.meta.outputs.update-type == 'version-update:semver-major' ||
          env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ secrets.CRIS_APPROVE_PAT || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          IN_SCOPE: ${{ steps.scope.outputs.in_scope }}
        run: |
          # Both reasons can hold at once (a major github-actions bump is exactly
          # that), and each is independently worth knowing. Accumulate rather than
          # branch: an if/else here reports the first and swallows the second, so
          # the reviewer sees "touches .github/" and never learns it is also a
          # major.
          reasons=""
          if [ "$IN_SCOPE" = "false" ]; then
            reasons="$reasons
          - it edits files under \`.github/\`, which \`CODEOWNERS\` anchors to a human on purpose — that is the directory deciding who approves."
          fi
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            reasons="$reasons
          - it is a **major** bump (\`$UPDATE_TYPE\`). Someone should read the changelog."
          fi
          if [ "$HAS_PAT" != "true" ]; then
            reasons="$reasons
          - \`CRIS_APPROVE_PAT\` is not configured, so I could not approve it even though it qualifies. Add the secret, or merge this one by hand."
          fi
          # Built with printf into a file, not passed as an indented literal:
          # Markdown renders four-space-indented lines as a code block, and the
          # bullets above must stay bullets.
          printf '%s\n%s\n\n%s\n\n%s\n%s\n' \
            "🤖 **Not auto-merging this one:**" \
            "$reasons" \
            "cc @ni500 @lcaloguerea" \
            "---" \
            "🤖 _Cris · PappCorn's AI agent_" > body.md
          gh pr comment "$PR_URL" --body-file body.md
