name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Marca de tiempo previa a la reseña. La usa "Enforce review verdict" para
      # distinguir una reseña PUBLICADA en esta corrida de una vieja que quedó
      # en el PR de días atrás (ver ClickUp 86e2etkv1).
      - name: Marcar inicio del review
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Un merge automatizado a una rama de partner (lo arma cris-approve)
          # actualiza el PR de integración con `actor = github-actions[bot]`, y
          # la acción se niega a correr para un actor no-humano: "Workflow
          # initiated by non-human actor". El review del PR de integración
          # FALLABA cada vez que el bot mergeaba algo — CI en verde, review en
          # rojo, sin relación visible con la causa.
          #
          # Lo correcto es revisarlo, no saltárselo: si nadie tocó el merge a
          # mano, con más razón alguien debería mirar el resultado. Se permite
          # el bot de Actions, y SOLO ese — nunca `*`.
          allowed_bots: "github-actions"

          # Pin an explicit, current model. The action's old default
          # (claude-sonnet-4-20250514) was retired and now 404s on the first
          # API call, failing the job before any review runs. Sonnet 4.6 is the
          # cost/quality fit for an automated per-PR gate; bump to
          # claude-opus-4-8 if deeper bug-finding is worth the cost.
          model: "claude-sonnet-4-6"

          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Review this pull request. Be concise — skip style nits-on-nits and praise.

            Focus strictly on these four areas:
            1. **Bugs introduced** by this diff.
            2. **Pre-existing bugs** in code paths the diff touches or relies on.
            3. **Security vulnerabilities** (injection, authz, secrets, unsafe deserialization, etc.).
            4. **Requirements fit** — does the diff actually deliver what the PR title and description claim?

            Tag every finding with a severity marker (matches Anthropic Code Review conventions):
            - 🔴 **Important** — bug introduced by this PR, security issue, or broken requirements fit. Blocks merge.
            - 🟡 **Nit** — minor issue worth mentioning (style on touched lines, micro-perf, naming). Does not block merge.
            - 🟣 **Pre-existing** — bug in the codebase not introduced by this PR. Informational only, never blocks merge.

            Only 🔴 Important findings block merge. Be deliberate about applying 🔴 — reserve it for things that would
            break production, leak data, or fail a stated requirement. When in doubt, downgrade to 🟡.

            Post the review using this exact structure:

            ## Findings
            Bulleted issues grouped by category (Introduced / Pre-existing / Security / Requirements fit).
            Each bullet: severity marker, `path/to/file.ts:line`, then the issue in one sentence.
            Omit empty categories. If nothing to flag anywhere, write `None.`

            ## Summary
            2–4 sentences max. Open with a one-line tally like `2 Important, 1 Nit, 0 Pre-existing`
            (or `No blocking issues.` when Important == 0). Then state what must change before merge, if anything.

            After posting the review, you MUST record the gating verdict for CI by running exactly one of:
            - `echo PASS > verdict.txt` — zero 🔴 Important findings
            - `echo FAIL > verdict.txt` — at least one 🔴 Important finding

            Nits and Pre-existing findings do NOT affect the verdict. The job fails if the file is missing
            or anything other than PASS.

          # Narrowly scoped: Claude can only write one of two verdict values.
          allowed_tools: "Bash(echo PASS > verdict.txt),Bash(echo FAIL > verdict.txt)"

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

      # El veredicto y la publicación de la reseña estaban desacoplados: si la
      # publicación fallaba o salía truncada, el check pasaba igual y el PR
      # quedaba VERDE SIN RESEÑA para el diff actual. Peor: /review-loop toma
      # "el último comentario con ## Findings", que podía ser de otro diff de
      # días atrás. Visto el 21-jul en los PR #104 (reseña de 8 días antes) y
      # #188 (comentario truncado). Un gate sin evidencia debe ser rojo.
      # ClickUp 86e2etkv1.
      - name: Verificar que la reseña se publicó
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          publicadas=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate --jq "[.[]
              | select(.created_at >= \"$REVIEW_STARTED_AT\")
              | select(.body | contains(\"## Findings\"))] | length")
          echo "Reseñas publicadas en esta corrida: $publicadas (desde $REVIEW_STARTED_AT)"
          if [ "$publicadas" -eq 0 ]; then
            echo "::error::La reseña no se publicó en el PR. El veredicto existe pero no hay evidencia legible para este diff — se falla en vez de pasar en verde sin reseña (ClickUp 86e2etkv1)."
            exit 1
          fi

      - name: Enforce review verdict
        run: |
          if [ ! -f verdict.txt ]; then
            echo "::error::Claude did not record a verdict — failing the job."
            exit 1
          fi
          verdict=$(tr -d '[:space:]' < verdict.txt)
          echo "Claude verdict: $verdict"
          if [ "$verdict" != "PASS" ]; then
            echo "::error::Important findings present — fix before merge."
            exit 1
          fi
          echo "::notice::Review passed: no Important findings."
